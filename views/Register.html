<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - UrlZen</title>
  
  <!-- Font Awesome via Cloudflare CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    /* Reset & Base Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f8fafc;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Navbar */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.25rem 2rem;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      color: #2563eb;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* Auth Wrapper */
    .auth-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
    }

    .auth-card {
      background: #ffffff;
      width: 100%;
      max-width: 500px; /* Slightly widened to fit inputs comfortably */
      padding: 2.5rem 2rem;
      border-radius: 12px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.02);
      border: 1px solid #e2e8f0;
    }

    .auth-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .auth-header h2 {
      font-size: 1.75rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 0.5rem;
    }

    .auth-header p {
      color: #64748b;
      font-size: 0.95rem;
    }

    /* Form Elements */
    .form-group {
      margin-bottom: 1.25rem;
    }

    /* Grid for Side-by-Side Passwords */
    .form-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
    }

    @media (min-width: 480px) {
      .form-row {
        grid-template-columns: 1fr 1fr;
      }
    }

    .form-label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      color: #334155;
      margin-bottom: 0.5rem;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper i {
      position: absolute;
      left: 1rem;
      color: #94a3b8;
      font-size: 1rem;
    }

    .form-input {
      width: 100%;
      padding: 0.75rem 1rem 0.75rem 2.5rem;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .terms-group {
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      font-size: 0.85rem;
      color: #475569;
    }

    .terms-group input {
      margin-top: 0.2rem;
    }

    .terms-group a {
      color: #2563eb;
      text-decoration: none;
    }

    .terms-group a:hover {
      text-decoration: underline;
    }

    .btn-submit {
      width: 100%;
      padding: 0.85rem;
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-submit:hover {
      background-color: #1d4ed8;
    }

    .auth-footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.9rem;
      color: #64748b;
    }

    .auth-footer a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 600;
    }

    .auth-footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <header>
    <nav class="navbar">
      <a href="index.html" class="logo">
        <i class="fa-solid fa-link"></i> UrlZen
      </a>
    </nav>
  </header>

  <!-- Registration Form -->
  <main class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <h2>Create an Account</h2>
        <p>Choose a username and password to get started</p>
      </div>

      <form onsubmit="event.preventDefault();">
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-user"></i>
            <input 
              type="text" 
              id="username" 
              class="form-input" 
              placeholder="johndoe" 
              required 
            />
          </div>
        </div>

        <!-- Side-by-Side Password Fields -->
        <div class="form-row form-group">
          <div>
            <label class="form-label" for="password">Create Password</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-lock"></i>
              <input 
                type="password" 
                id="password" 
                class="form-input" 
                placeholder="At least 8 chars" 
                required 
              />
            </div>
          </div>

          <div>
            <label class="form-label" for="confirm-password">Confirm Password</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-lock"></i>
              <input 
                type="password" 
                id="confirm-password" 
                class="form-input" 
                placeholder="Re-enter password" 
                required 
              />
            </div>
          </div>
        </div>

        <div class="terms-group">
          <input type="checkbox" id="terms" required>
          <label for="terms">
            I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
          </label>
        </div>

        <button type="submit" class="btn-submit">
          <i class="fa-solid fa-user-plus"></i> Create Account
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="login.html">Sign in</a>
      </div>
    </div>
  </main>

</body>
</html>
